<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anteprima CamperFinder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .hero-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; }
        .card-shadow { box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1); }
        .btn-action { transition: transform 0.1s; cursor: pointer; }
        .btn-action:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-2 rounded text-white"><i data-lucide="compass" class="w-5 h-5"></i></div>
                <span class="font-black text-xl tracking-tight text-slate-900">CAMPER<span class="text-blue-600">FINDER</span></span>
            </div>
            <div class="text-xs font-bold uppercase text-green-600 bg-green-100 px-3 py-1 rounded-full animate-pulse">
                Sistema Attivo
            </div>
        </div>
    </nav>

    <header class="hero-bg pt-32 pb-48 px-4 text-center">
        <h1 class="text-4xl md:text-6xl font-black mb-6 tracking-tight">Il tuo viaggio inizia qui.</h1>
        <p class="text-slate-400 text-lg max-w-xl mx-auto">Confronta prezzi e disponibilità di Yescapa, Goboony, Indie Campers e Roadsurfer.</p>
    </header>

    <div class="max-w-5xl mx-auto px-4 -mt-24 relative z-10">
        <div class="bg-white p-6 rounded-[2rem] shadow-2xl border border-gray-100 grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
            <div class="bg-slate-50 p-3 rounded-xl border border-transparent focus-within:border-blue-500 transition">
                <label class="block text-[10px] font-bold uppercase text-slate-400 ml-1">Dove</label>
                <input type="text" id="destinazione" placeholder="Es. Sardegna" class="bg-transparent w-full text-sm font-bold outline-none text-slate-900">
            </div>
            <div class="bg-slate-50 p-3 rounded-xl border border-transparent focus-within:border-blue-500 transition">
                <label class="block text-[10px] font-bold uppercase text-slate-400 ml-1">Ritiro</label>
                <input type="date" id="data_inizio" class="bg-transparent w-full text-sm font-bold outline-none text-slate-900 cursor-pointer">
            </div>
            <div class="bg-slate-50 p-3 rounded-xl border border-transparent focus-within:border-blue-500 transition">
                <label class="block text-[10px] font-bold uppercase text-slate-400 ml-1">Rientro</label>
                <input type="date" id="data_fine" class="bg-transparent w-full text-sm font-bold outline-none text-slate-900 cursor-pointer">
            </div>
            <button onclick="simulaRicerca()" class="bg-blue-600 text-white h-full py-4 rounded-xl font-black uppercase text-xs tracking-widest hover:bg-blue-700 btn-action shadow-lg shadow-blue-200">
                Aggiorna
            </button>
        </div>
    </div>

    <main class="max-w-6xl mx-auto py-20 px-4">
        <h2 class="text-2xl font-black text-slate-900 mb-8">Veicoli Disponibili</h2>
        
        <div id="griglia" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            </div>
    </main>

    <footer class="bg-slate-900 text-white py-12 text-center text-sm text-slate-500">
        &copy; 2026 CamperFinder Pro
    </footer>

    <script>
        lucide.createIcons();

        // 1. DATABASE STATICO (Questo assicura che si veda sempre qualcosa)
        const veicoli = [
            { nome: "Volkswagen California", partner: "indie", tipo: "Van", prezzo: 105, img: "https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?w=800" },
            { nome: "Fiat Ducato Family", partner: "yescapa", tipo: "Camper", prezzo: 120, img: "https://images.unsplash.com/photo-1517524008436-bb401ac293b8?w=800" },
            { nome: "Mercedes Marco Polo", partner: "roadsurfer", tipo: "Van", prezzo: 140, img: "https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?w=800" },
            { nome: "Ford Nugget", partner: "goboony", tipo: "Van", prezzo: 90, img: "https://images.unsplash.com/photo-1626202377881-80512eb24a02?w=800" },
            { nome: "Hymer Grand Canyon", partner: "goboony", tipo: "Camper", prezzo: 130, img: "https://images.unsplash.com/photo-1616898953934-4e4b6eb35d08?w=800" },
            { nome: "Vintage VW Bulli", partner: "yescapa", tipo: "Van", prezzo: 80, img: "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=800" }
        ];

        // 2. FUNZIONE PER MOSTRARE LE CARD
        function mostraVeicoli() {
            const container = document.getElementById('griglia');
            container.innerHTML = ""; // Pulisce

            veicoli.forEach(v => {
                // Colori personalizzati per ogni partner
                let coloreBtn = "bg-slate-900";
                let nomePartner = v.partner.toUpperCase();
                
                if(v.partner === 'yescapa') coloreBtn = "bg-orange-500";
                if(v.partner === 'goboony') coloreBtn = "bg-teal-600";
                if(v.partner === 'roadsurfer') coloreBtn = "bg-yellow-400 text-black";
                if(v.partner === 'indie') coloreBtn = "bg-blue-800";

                const html = `
                <div class="bg-white rounded-3xl overflow-hidden card-shadow border border-slate-100 flex flex-col group hover:border-blue-500 transition duration-300">
                    <div class="relative h-48 overflow-hidden">
                        <img src="${v.img}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                        <span class="absolute top-3 left-3 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest text-slate-900 shadow-sm">${v.tipo}</span>
                    </div>
                    <div class="p-6 flex flex-col flex-grow">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-lg text-slate-900">${v.nome}</h3>
                            <span class="text-[10px] font-bold bg-slate-50 border border-slate-200 px-2 py-1 rounded text-slate-500 uppercase">${nomePartner}</span>
                        </div>
                        <div class="mt-auto pt-6 border-t border-slate-50 flex items-center justify-between">
                            <div>
                                <p class="text-[10px] text-slate-400 font-bold uppercase">Da</p>
                                <p class="text-2xl font-black text-slate-900">€${v.prezzo}</p>
                            </div>
                            <button onclick="vaiAlSito('${v.partner}', '${v.tipo}')" class="${coloreBtn} px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-widest shadow-lg btn-action hover:opacity-90">
                                Vedi
                            </button>
                        </div>
                    </div>
                </div>`;
                container.innerHTML += html;
            });
        }

        // 3. FUNZIONE SIMULAZIONE RICERCA
        function simulaRicerca() {
            const btn = document.querySelector('button[onclick="simulaRicerca()"]');
            const original = btn.innerText;
            btn.innerText = "...";
            // Piccolo delay per dare feedback all'utente
            setTimeout(() => {
                btn.innerText = original;
                alert("Prezzi aggiornati! Clicca su 'Vedi' per andare al sito partner.");
            }, 300);
        }

        // 4. FUNZIONE LINK REALI (Qui avviene la magia)
        function formatDateIT(iso) {
            if(!iso) return "";
            const [y, m, d] = iso.split('-');
            return ${d}/${m}/${y};
        }

        function vaiAlSito(partner, tipo) {
            let loc = document.getElementById('destinazione').value.trim();
            if(!loc) loc = "Italia"; // Default se vuoto
            
            const startISO = document.getElementById('data_inizio').value;
            const endISO = document.getElementById('data_fine').value;

            let url = "";

            if(partner === 'goboony') {
                let cat = (tipo.toLowerCase() === 'van') ? '/van' : '/motorhome';
                url = https://www.goboony.it/noleggio-camper/${loc}${cat}?arrival=${startISO}&departure=${endISO};
            }
            else if(partner === 'yescapa') {
                const sIT = formatDateIT(startISO);
                const eIT = formatDateIT(endISO);
                url = https://it.yescapa.com/s/${loc}/?arrival=${encodeURIComponent(sIT)}&departure=${encodeURIComponent(eIT)};
            }
            else if(partner === 'indie') {
                url = https://indiecampers.it/noleggio-camper/${loc};
            }
            else {
                url = https://roadsurfer.com/it-it/noleggio-camper/;
            }

            // Apre in nuova scheda
            window.open(url, '_blank');
        }

        // Carica i veicoli appena apri la pagina
        window.onload = mostraVeicoli;

    </script>
</body>
</html>
