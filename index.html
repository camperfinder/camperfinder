<script>
// SOSTITUISCI QUESTO ID
const sheetId = "https://docs.google.com/spreadsheets/d/1b1eqBL0gaSd_mOgdndEDj9Hh3ckad7U78gXIEQ33Yvc/edit?usp=sharing"; 
const url = https://opensheet.elk.sh/${sheetId}/Foglio1;

const results = document.getElementById("results");
const search = document.getElementById("search");
const type = document.getElementById("type");
const maxPrice = document.getElementById("maxPrice");

let dataGlobal = []; // Variabile per contenere i dati scaricati

fetch(url)
  .then(res => {
    if (!res.ok) throw new Error("Errore nel caricamento dati. Controlla l'ID del foglio.");
    return res.json();
  })
  .then(data => {
    // Trasforma i prezzi in numeri e pulisce i dati
    dataGlobal = data.map(i => ({
      ...i,
      Prezzo: Number(i.Prezzo.toString().replace(',', '.')) // Gestisce anche virgole italiane
    }));

    const lowestPrice = Math.min(...dataGlobal.map(i => i.Prezzo));

    // Calcolo punteggio per "Migliore Scelta"
    dataGlobal.forEach(i => {
      i.score = 0;
      if (i.Tipo === "Van") i.score += 1;
      if (i.Prezzo <= lowestPrice * 1.15) i.score += 2;
    });

    // Ordinamento iniziale
    dataGlobal.sort((a, b) => (b.score - a.score) || (a.Prezzo - b.Prezzo));

    render(dataGlobal, lowestPrice);

    // Event Listeners per i filtri
    [search, type, maxPrice].forEach(el => {
      el.addEventListener("input", () => filter(lowestPrice));
    });
  })
  .catch(err => {
    results.innerHTML = <p style="text-align:center; color:red;">Impossibile caricare i dati. Verifica l'ID del foglio e i permessi di condivisione.</p>;
    console.error(err);
  });

function render(items, lowestPrice) {
  results.innerHTML = items.length ? "" : "<p>Nessun risultato trovato.</p>";
  items.forEach(i => {
    results.innerHTML += `
      <div class="card">
        ${i.score >= 3 ? <div class="badge best">MIGLIORE SCELTA</div> : ""}
        ${i.Prezzo === lowestPrice ? <div class="badge lowest">PREZZO PIÙ BASSO</div> : ""}
        <div class="info">
          <h3>${i.Nome}</h3>
          <p>${i.Città} • <strong>${i.Tipo}</strong></p>
        </div>
        <div class="price-box">
          <div class="price">€${i.Prezzo}/giorno</div>
          <a class="button" href="${i.Link}" target="_blank">Vai all’offerta</a>
        </div>
      </div>
    `;
  });
}

function filter(lowestPrice) {
  let filtered = dataGlobal.filter(i => {
    const matchSearch = !search.value || 
      i.Nome.toLowerCase().includes(search.value.toLowerCase()) ||
      i.Città.toLowerCase().includes(search.value.toLowerCase());
    
    const matchType = !type.value || i.Tipo === type.value;
    
    const matchPrice = !maxPrice.value || i.Prezzo <= Number(maxPrice.value);

    return matchSearch && matchType && matchPrice;
  });

  render(filtered, lowestPrice);
}
</script>
