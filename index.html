<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamperFinder Pro | Funzionante</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .card-anim { transition: all 0.3s ease; }
        .card-anim:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<nav class="bg-slate-900 text-white py-4 px-6 flex justify-between items-center sticky top-0 z-50 shadow-md">
    <div class="flex items-center gap-2">
        <div class="bg-blue-600 p-2 rounded-lg"><i data-lucide="search"></i></div>
        <span class="font-extrabold text-xl tracking-tighter uppercase italic">CAMPER<span class="text-blue-500">FINDER</span></span>
    </div>
    <div class="text-xs font-bold text-gray-400">MOTORE ATTIVO</div>
</nav>

<div class="bg-white border-b border-gray-200 py-8 px-4 sticky top-[70px] z-40 shadow-sm">
    <div class="max-w-6xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-slate-50 p-4 rounded-3xl border border-gray-200">
            <div class="group">
                <label class="text-[10px] font-black uppercase text-gray-400 ml-2">Destinazione</label>
                <input type="text" id="loc" placeholder="Es. Roma" class="w-full p-3 bg-white rounded-xl font-bold border-2 border-transparent focus:border-blue-500 outline-none text-slate-900">
            </div>
            <div>
                <label class="text-[10px] font-black uppercase text-gray-400 ml-2">Ritiro</label>
                <input type="date" id="start" class="w-full p-3 bg-white rounded-xl font-bold border-2 border-transparent focus:border-blue-500 outline-none text-slate-900 cursor-pointer">
            </div>
            <div>
                <label class="text-[10px] font-black uppercase text-gray-400 ml-2">Rientro</label>
                <input type="date" id="end" class="w-full p-3 bg-white rounded-xl font-bold border-2 border-transparent focus:border-blue-500 outline-none text-slate-900 cursor-pointer">
            </div>
            <div class="flex items-end">
                <button onclick="cercaVeicoli()" id="btn-cerca" class="w-full bg-blue-600 text-white p-3 rounded-xl font-black uppercase text-xs tracking-widest hover:bg-blue-700 transition flex justify-center items-center gap-2 shadow-lg shadow-blue-200">
                    <span id="btn-text">CERCA ORA</span>
                    <div id="btn-loader" class="loader hidden"></div>
                </button>
            </div>
        </div>
        <div class="mt-4 flex items-center gap-4 text-sm font-bold text-gray-500">
            <span>Budget Max:</span>
            <input type="range" id="budgetRange" min="50" max="300" value="300" class="w-48 accent-blue-600 cursor-pointer" oninput="aggiornaPrezzo(this.value)">
            <span id="budgetValue" class="text-blue-600">€300</span> <span class="text-xs font-normal">/notte</span>
        </div>
    </div>
</div>

<main class="max-w-6xl mx-auto py-10 px-4">
    <div id="loading-area" class="hidden text-center py-20">
        <div class="loader mx-auto mb-4" style="width: 40px; height: 40px; border-width: 4px;"></div>
        <p class="text-gray-400 font-bold animate-pulse">Sto cercando le offerte migliori...</p>
    </div>

    <div id="results-area" class="grid grid-cols-1 md:grid-cols-3 gap-6">
        </div>
</main>

<script>
    lucide.createIcons();

    // --- DATABASE DEI VEICOLI ---
    const flotta = [
        { nome: "Ford Nugget", partner: "goboony", tipo: "Van", prezzo: 85, posti: 4, img: "https://images.unsplash.com/photo-1626202377881-80512eb24a02?w=800" },
        { nome: "Fiat Ducato", partner: "yescapa", tipo: "Camper", prezzo: 110, posti: 6, img: "https://images.unsplash.com/photo-1517524008436-bb401ac293b8?w=800" },
        { nome: "VW California", partner: "indie", tipo: "Van", prezzo: 105, posti: 4, img: "https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?w=800" },
        { nome: "Mercedes Marco Polo", partner: "roadsurfer", tipo: "Van", prezzo: 130, posti: 4, img: "https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?w=800" },
        { nome: "Hymer Grand Canyon", partner: "goboony", tipo: "Camper", prezzo: 125, posti: 4, img: "https://images.unsplash.com/photo-1616898953934-4e4b6eb35d08?w=800" },
        { nome: "Vintage VW T2", partner: "yescapa", tipo: "Van", prezzo: 75, posti: 2, img: "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=800" }
    ];

    // --- FUNZIONE DI AVVIO: Mostra tutto subito ---
    window.onload = function() {
        renderizzaGriglia(flotta);
    };

    // --- FUNZIONE CERCA ---
    function cercaVeicoli() {
        // 1. Feedback visivo (Caricamento)
        document.getElementById('btn-text').innerText = "CERCANDO...";
        document.getElementById('btn-loader').classList.remove('hidden');
        document.getElementById('results-area').classList.add('opacity-50');
        
        // 2. Prendi il budget dal range
        const maxBudget = document.getElementById('budgetRange').value;

        // 3. Simula attesa (mezzo secondo) per sembrare vero
        setTimeout(() => {
            // Filtra i veicoli
            const risultatiFiltrati = flotta.filter(v => v.prezzo <= maxBudget);
            
            // Aggiorna la pagina
            renderizzaGriglia(risultatiFiltrati);
            
            // Ripristina tasto
            document.getElementById('btn-text').innerText = "CERCA ORA";
            document.getElementById('btn-loader').classList.add('hidden');
            document.getElementById('results-area').classList.remove('opacity-50');
            
            if(risultatiFiltrati.length === 0) {
                document.getElementById('results-area').innerHTML = <div class="col-span-full text-center py-10 text-gray-400 font-bold">Nessun veicolo trovato sotto €${maxBudget}/notte.<br>Prova ad alzare il budget.</div>;
            }

        }, 600);
    }

    // --- AGGIORNA VISUALIZZAZIONE BUDGET ---
    function aggiornaPrezzo(val) {
        document.getElementById('budgetValue').innerText = "€" + val;
    }

    // --- RENDERIZZA HTML (Crea le carte) ---
    function renderizzaGriglia(dati) {
        const container = document.getElementById('results-area');
        container.innerHTML = ""; // Pulisci

        dati.forEach(v => {
            // Stile per ogni partner
            let color = "bg-gray-800";
            let label = v.partner.toUpperCase();
            if(v.partner === 'yescapa') { color = "bg-orange-500"; }
            if(v.partner === 'goboony') { color = "bg-teal-600"; }
            if(v.partner === 'roadsurfer') { color = "bg-yellow-500 text-black"; }
            if(v.partner === 'indie') { color = "bg-blue-800"; }

            const cardHTML = `
            <div class="bg-white rounded-[2rem] overflow-hidden card-anim flex flex-col border border-gray-100">
                <div class="relative h-48">
                    <img src="${v.img}" class="w-full h-full object-cover">
                    <span class="absolute top-4 left-4 bg-white/90 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest">${v.tipo}</span>
                </div>
                <div class="p-6 flex flex-col flex-grow">
                    <div class="flex justify-between mb-2">
                        <h3 class="font-bold text-lg text-slate-900">${v.nome}</h3>
                        <span class="text-[10px] font-black uppercase text-gray-400 border border-gray-200 px-2 py-1 rounded">${label}</span>
                    </div>
                    <div class="mt-auto flex justify-between items-center pt-4 border-t border-gray-50">
                        <div>
                            <p class="text-[10px] text-gray-400 font-bold uppercase">Prezzo per notte</p>
                            <p class="text-2xl font-black text-slate-900">€${v.prezzo}</p>
                        </div>
                        <button onclick="apriLink('${v.partner}', '${v.tipo}')" class="${color} ${v.partner === 'roadsurfer' ? '' : 'text-white'} px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:opacity-90 shadow-md transition">
                            Vedi Offerta
                        </button>
                    </div>
                </div>
            </div>
            `;
            container.innerHTML += cardHTML;
        });
    }

    // --- FORMATTA DATA (Per Yescapa) ---
    function formatData(iso) {
        if(!iso) return "";
        const [y, m, d] = iso.split('-');
        return ${d}/${m}/${y};
    }

    // --- APERTURA LINK (Logica corretta) ---
    function apriLink(partner, tipo) {
        let loc = document.getElementById('loc').value.trim();
        if(!loc) loc = "Italia"; // Default
        
        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;

        // Se l'utente non mette date, avvisalo (opzionale, qui procediamo lo stesso)
        if((!start || !end) && partner !== 'indie' && partner !== 'roadsurfer') {
            alert("Consiglio: Inserisci le date per vedere i prezzi reali!");
        }

        let url = "";

        if(partner === 'goboony') {
            let cat = tipo === 'Van' ? '/van' : '/motorhome';
            url = https://www.goboony.it/noleggio-camper/${loc}${cat}?arrival=${start}&departure=${end};
        }
        else if(partner === 'yescapa') {
            const sIT = formatData(start);
            const eIT = formatData(end);
            url = https://it.yescapa.com/s/${loc}/?arrival=${encodeURIComponent(sIT)}&departure=${encodeURIComponent(eIT)};
        }
        else if(partner === 'indie') {
            url = https://indiecampers.it/noleggio-camper/${loc};
        }
        else {
            url = https://roadsurfer.com/it-it/noleggio-camper/;
        }

        window.open(url, '_blank');
    }
</script>

</body>
</html>
