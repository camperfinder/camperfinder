<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamperFinder Pro | Catalogo Reale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .van-card { transition: all 0.3s ease; background: white; border: 1px solid #e2e8f0; border-radius: 1.5rem; overflow: hidden; }
        .van-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1); border-color: #3b82f6; }
        /* Fix per rendere i bottoni cliccabili su mobile */
        button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>

<nav class="bg-white border-b border-gray-100 py-4 px-6 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-2">
        <div class="bg-blue-600 p-2 rounded-lg text-white"><i data-lucide="layout-grid"></i></div>
        <span class="font-extrabold text-xl tracking-tighter uppercase italic text-gray-900">CAMPER<span class="text-blue-600">FINDER</span></span>
    </div>
    <div class="hidden md:block text-xs font-bold text-gray-400 uppercase tracking-widest">
        Offerte Trovate: <span id="count" class="text-blue-600">6</span>
    </div>
</nav>

<div class="bg-white border-b border-gray-200 py-6 px-4 shadow-sm relative z-40">
    <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
            <label class="text-[10px] font-black text-gray-400 uppercase ml-2">Destinazione</label>
            <input type="text" id="loc" placeholder="Italia" class="w-full bg-gray-50 p-3 rounded-xl font-bold text-sm outline-none border border-transparent focus:border-blue-500">
        </div>
        <div>
            <label class="text-[10px] font-black text-gray-400 uppercase ml-2">Ritiro</label>
            <input type="date" id="start" class="w-full bg-gray-50 p-3 rounded-xl font-bold text-sm outline-none border border-transparent focus:border-blue-500">
        </div>
        <div>
            <label class="text-[10px] font-black text-gray-400 uppercase ml-2">Rientro</label>
            <input type="date" id="end" class="w-full bg-gray-50 p-3 rounded-xl font-bold text-sm outline-none border border-transparent focus:border-blue-500">
        </div>
        <div>
            <label class="text-[10px] font-black text-gray-400 uppercase ml-2">Budget Max (€)</label>
            <input type="number" id="budget" placeholder="2000" class="w-full bg-gray-50 p-3 rounded-xl font-bold text-sm outline-none border border-transparent focus:border-blue-500" oninput="aggiornaGriglia()">
        </div>
    </div>
    <div class="max-w-7xl mx-auto mt-4 flex justify-end">
        <button onclick="aggiornaGriglia()" class="w-full md:w-auto bg-blue-600 text-white px-8 py-3 rounded-xl font-black text-xs uppercase tracking-widest hover:bg-blue-700 transition shadow-lg">
            Aggiorna Prezzi
        </button>
    </div>
</div>

<main class="max-w-7xl mx-auto py-10 px-4">
    <div id="grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        </div>
</main>

<script>
    lucide.createIcons();

    // --- DATABASE ANNUNCI ---
    const database = [
        { id: 1, nome: "VW California Ocean", tipo: "van", posti: 4, prezzoNotte: 95, img: "https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?w=800", partner: "indie", desc: "Il classico moderno. Cucina integrata." },
        { id: 2, nome: "Fiat Ducato Family", tipo: "camper", posti: 6, prezzoNotte: 120, img: "https://images.unsplash.com/photo-1517524008436-bb401ac293b8?w=800", partner: "yescapa", desc: "Spazio per tutta la famiglia." },
        { id: 3, nome: "Mercedes Sprinter 4x4", tipo: "van", posti: 2, prezzoNotte: 140, img: "https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?w=800", partner: "roadsurfer", desc: "Per avventure off-road." },
        { id: 4, nome: "Ford Nugget", tipo: "van", posti: 4, prezzoNotte: 85, img: "https://images.unsplash.com/photo-1626202377881-80512eb24a02?w=800", partner: "goboony", desc: "Compatto e agile in città." },
        { id: 5, nome: "Hymer Grand Canyon", tipo: "camper", posti: 4, prezzoNotte: 110, img: "https://images.unsplash.com/photo-1616898953934-4e4b6eb35d08?w=800", partner: "goboony", desc: "Lusso e finiture premium." },
        { id: 6, nome: "Vintage VW T2", tipo: "van", posti: 2, prezzoNotte: 70, img: "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=800", partner: "yescapa", desc: "Stile inconfondibile." }
    ];

    // --- FUNZIONE PER FORMATTARE LA DATA (Essenziale per Yescapa) ---
    function formatDataIT(dataISO) {
        if(!dataISO) return "";
        // Trasforma 2026-01-09 in 09/01/2026
        const [year, month, day] = dataISO.split('-');
        return ${day}/${month}/${year};
    }

    // --- GENERATORE DI CARTE ---
    function aggiornaGriglia() {
        const container = document.getElementById('grid-container');
        const budgetInput = document.getElementById('budget').value;
        const startIn = document.getElementById('start').value;
        const endIn = document.getElementById('end').value;

        // Calcolo giorni (default 3 se vuoto)
        let giorni = 3; 
        if (startIn && endIn) {
            const d1 = new Date(startIn);
            const d2 = new Date(endIn);
            const diff = d2 - d1;
            const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
            if (days > 0) giorni = days;
        }

        container.innerHTML = "";
        let count = 0;

        database.forEach(van => {
            const totale = van.prezzoNotte * giorni;
            if (budgetInput && totale > budgetInput) return; // Filtro budget

            count++;
            
            // Logica colori bottoni
            let btnStyle = "bg-gray-900 text-white";
            let labelPartner = van.partner.toUpperCase();
            if(van.partner === 'yescapa') { btnStyle = "bg-orange-500 text-white"; }
            if(van.partner === 'goboony') { btnStyle = "bg-teal-600 text-white"; }
            if(van.partner === 'roadsurfer') { btnStyle = "bg-yellow-400 text-black"; }
            if(van.partner === 'indie') { btnStyle = "bg-blue-800 text-white"; }

            // HTML Carta
            const card = `
            <div class="van-card flex flex-col h-full group">
                <div class="relative h-56 overflow-hidden">
                    <img src="${van.img}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                    <div class="absolute top-3 left-3 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest text-gray-900">
                        ${van.tipo}
                    </div>
                </div>
                <div class="p-6 flex flex-col flex-grow">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold text-xl text-gray-900">${van.nome}</h3>
                        <span class="text-[10px] font-bold bg-gray-100 px-2 py-1 rounded text-gray-500">${labelPartner}</span>
                    </div>
                    <p class="text-sm text-gray-500 mb-6">${van.desc}</p>
                    <div class="mt-auto border-t border-gray-100 pt-4 flex items-center justify-between">
                        <div>
                            <p class="text-[10px] text-gray-400 font-bold uppercase">Totale ${giorni} notti</p>
                            <p class="text-2xl font-black text-blue-600">€${totale}</p>
                        </div>
                        <button onclick="apriPartner('${van.partner}', '${van.tipo}')" class="${btnStyle} px-5 py-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:opacity-90 shadow-lg transition">
                            Vedi Offerta
                        </button>
                    </div>
                </div>
            </div>`;
            container.innerHTML += card;
        });

        document.getElementById('count').innerText = count;
        if(count === 0) container.innerHTML = <div class="col-span-full text-center py-20 text-gray-400 font-bold">Nessun van trovato nel budget.</div>;
    }

    // --- IL MOTORE DEI LINK (CORRETTO) ---
    function apriPartner(partner, tipoVeicolo) {
        // Recupero dati
        let loc = document.getElementById('loc').value.trim();
        if(!loc) loc = "Italia"; // Fallback di sicurezza
        
        const startISO = document.getElementById('start').value; // YYYY-MM-DD
        const endISO = document.getElementById('end').value;     // YYYY-MM-DD
        
        let url = "";

        if (partner === 'goboony') {
            // Goboony accetta YYYY-MM-DD
            let category = (tipoVeicolo === 'van') ? '/van' : '/motorhome';
            url = https://www.goboony.it/noleggio-camper/${loc}${category}?arrival=${startISO}&departure=${endISO};
        } 
        else if (partner === 'yescapa') {
            // FIX CRUCIALE: Yescapa vuole DD/MM/YYYY
            const startIT = formatDataIT(startISO);
            const endIT = formatDataIT(endISO);
            // codifica URL (sostituisce / con %2F)
            const sEnc = encodeURIComponent(startIT);
            const eEnc = encodeURIComponent(endIT);
            url = https://it.yescapa.com/s/${loc}/?arrival=${sEnc}&departure=${eEnc};
        }
        else if (partner === 'indie') {
            // Indie Campers accetta solo il luogo nel path
            url = https://indiecampers.it/noleggio-camper/${loc};
        }
        else if (partner === 'roadsurfer') {
            // Roadsurfer link generico
            url = https://roadsurfer.com/it-it/noleggio-camper/;
        }

        // Apertura in nuova scheda
        window.open(url, '_blank');
    }

    // Avvio iniziale
    window.onload = aggiornaGriglia;
</script>

</body>
</html>
