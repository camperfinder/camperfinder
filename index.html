<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>CamperFinder – Il modo più intelligente di noleggiare un camper</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Trova il noleggio camper più economico. Confronta offerte reali e prenota dal sito ufficiale.">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
  background: #eef1f5;
  color: #1d1d1f;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #0a3d62, #3c6382);
  color: white;
  padding: 35px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 34px;
}

header p {
  margin-top: 10px;
  font-size: 18px;
  opacity: 0.95;
}

/* FILTER BAR */
.filters {
  background: white;
  max-width: 1100px;
  margin: -30px auto 30px;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.15);
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
}

.filters input,
.filters select {
  padding: 12px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid #ddd;
  flex: 1;
  min-width: 180px;
}

/* RESULTS */
.container {
  max-width: 1100px;
  margin: auto;
  padding: 0 20px 40px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 22px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.1);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  position: relative;
}

.badge {
  position: absolute;
  top: -10px;
  left: -10px;
  background: #ff3b3b;
  color: white;
  padding: 8px 12px;
  font-size: 14px;
  font-weight: bold;
  border-radius: 12px;
}

.info {
  max-width: 65%;
}

.info h3 {
  margin: 0 0 6px;
  font-size: 24px;
}

.info p {
  margin: 4px 0;
  color: #555;
}

.price-box {
  text-align: right;
}

.price {
  font-size: 28px;
  font-weight: 700;
  color: #0a3d62;
}

.button {
  display: inline-block;
  margin-top: 12px;
  padding: 14px 22px;
  background: #ff9f1a;
  color: white;
  text-decoration: none;
  border-radius: 12px;
  font-weight: bold;
}

.button:hover {
  background: #e58e0b;
}

/* MOBILE */
@media (max-width: 700px) {
  .card {
    flex-direction: column;
    align-items: flex-start;
  }
  .info {
    max-width: 100%;
  }
  .price-box {
    width: 100%;
    margin-top: 15px;
    text-align: left;
  }
}

footer {
  text-align: center;
  padding: 25px;
  font-size: 14px;
  color: #666;
}
</style>
</head>

<body>

<header>
  <h1>CamperFinder</h1>
  <p>Il modo più intelligente per noleggiare un camper</p>
</header>

<div class="filters">
  <input type="text" id="search" placeholder="Città o compagnia">
  <select id="type">
    <option value="">Tutti i tipi</option>
    <option value="Camper">Camper</option>
    <option value="Van">Van</option>
    <option value="Caravan">Caravan</option>
  </select>
  <input type="number" id="maxPrice" placeholder="Prezzo massimo (€)">
</div>

<div class="container" id="results"></div>

<footer>
  Prezzi indicativi. Prenotazione sempre sui siti ufficiali dei fornitori.
</footer>

<script>
const sheetLink = "https://docs.google.com/spreadsheets/d/1b1eqBL0gaSd_mOgdndEDj9Hh3ckad7U78gXIEQ33Yvc/edit?usp=sharing";
const sheetId = sheetLink.split("/")[5];
const url = https://opensheet.elk.sh/${sheetId}/Foglio1;

fetch(url)
  .then(res => res.json())
  .then(data => {
    data.forEach(i => i.Prezzo = Number(i.Prezzo));
    data.sort((a, b) => a.Prezzo - b.Prezzo);
data.forEach(i => {
  i.score = 0;
  if (i.Tipo === "Van") i.score += 1;
  if (i.Prezzo <= data[0].Prezzo * 1.15) i.score += 2;
});

data.sort((a, b) => {
  if (b.score !== a.score) return b.score - a.score;
  return a.Prezzo - b.Prezzo;
});
    const lowestPrice = data[0]?.Prezzo;

    const results = document.getElementById("results");
    const search = document.getElementById("search");
    const type = document.getElementById("type");
    const maxPrice = document.getElementById("maxPrice");

    function render(items) {
      results.innerHTML = "";
      items.forEach(i => {
        results.innerHTML += `
          <div class="card">
            ${i.score >= 3 ? <div class="badge" style="background:#2ecc71">MIGLIORE SCELTA</div> : ""
            <div class="info">
              <h3>${i.Nome}</h3>
              <p>${i.Città} • ${i.Tipo}</p>
            </div>
            <div class="price-box">
              <div class="price">€${i.Prezzo}/giorno</div>
              <a class="button" href="${i.Link}" target="_blank">Vai all’offerta</a>
            </div>
          </div>
        `;
      });
    }

    function filter() {
      let items = data;

      if (search.value)
        items = items.filter(i =>
          i.Nome.toLowerCase().includes(search.value.toLowerCase()) ||
          i.Città.toLowerCase().includes(search.value.toLowerCase())
        );

      if (type.value)
        items = items.filter(i => i.Tipo === type.value);

      if (maxPrice.value)
        items = items.filter(i => i.Prezzo <= Number(maxPrice.value));

      render(items);
    }

    [search, type, maxPrice].forEach(el => el.addEventListener("input", filter));
    render(data);
  });
</script>

</body>
</html>
