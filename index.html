<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>CamperFinder – Trova il camper più economico</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Confronta i noleggi camper più economici e vai al sito ufficiale.">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
  background: #f1f3f6;
  color: #222;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #0f4c81, #1f7bb6);
  color: white;
  padding: 30px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  margin-top: 10px;
  font-size: 18px;
  opacity: 0.9;
}

/* SEARCH */
.search-box {
  max-width: 900px;
  margin: -25px auto 30px;
  padding: 20px;
}

.search-box input {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  border-radius: 12px;
  border: none;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

/* RESULTS */
.container {
  max-width: 1000px;
  margin: auto;
  padding: 0 20px 40px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
}

.info {
  max-width: 65%;
}

.info h3 {
  margin: 0 0 8px;
  font-size: 22px;
}

.info p {
  margin: 4px 0;
  color: #555;
}

.price-box {
  text-align: right;
}

.price {
  font-size: 26px;
  font-weight: bold;
  color: #0f4c81;
}

.button {
  display: inline-block;
  margin-top: 10px;
  padding: 12px 18px;
  background: #ff7a00;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-weight: bold;
}

.button:hover {
  background: #e56c00;
}

/* MOBILE */
@media (max-width: 700px) {
  .card {
    flex-direction: column;
    align-items: flex-start;
  }
  .info {
    max-width: 100%;
  }
  .price-box {
    width: 100%;
    margin-top: 15px;
    text-align: left;
  }
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  font-size: 14px;
  color: #666;
}
</style>
</head>

<body>

<header>
  <h1>CamperFinder</h1>
  <p>Confronta i noleggi camper più economici</p>
</header>

<div class="search-box">
  <input type="text" id="search" placeholder="Cerca città o compagnia…">
</div>

<div class="container" id="results"></div>

<footer>
  Prezzi indicativi. Prenotazione sempre sul sito ufficiale del fornitore.
</footer>

<script>
const sheetLink = "https://docs.google.com/spreadsheets/d/1b1eqBL0gaSd_mOgdndEDj9Hh3ckad7U78gXIEQ33Yvc/edit?usp=sharing";
const sheetId = sheetLink.split("/")[5];
const url = https://opensheet.elk.sh/${sheetId}/Foglio1;

fetch(url)
  .then(res => res.json())
  .then(data => {
    // Ordina per prezzo più basso
    data.sort((a, b) => Number(a.Prezzo) - Number(b.Prezzo));

    const results = document.getElementById("results");
    const search = document.getElementById("search");

    function render(items) {
      results.innerHTML = "";
      items.forEach(i => {
        results.innerHTML += `
          <div class="card">
            <div class="info">
              <h3>${i.Nome}</h3>
              <p>${i.Città} • ${i.Tipo}</p>
            </div>
            <div class="price-box">
              <div class="price">€${i.Prezzo}/giorno</div>
              <a class="button" href="${i.Link}" target="_blank">Vai all’offerta</a>
            </div>
          </div>
        `;
      });
    }

    render(data);

    search.addEventListener("input", e => {
      const v = e.target.value.toLowerCase();
      render(data.filter(i =>
        i.Nome.toLowerCase().includes(v) ||
        i.Città.toLowerCase().includes(v)
      ));
    });
  });
</script>

</body>
</html>
